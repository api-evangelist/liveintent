versioning:
  scheme: per-endpoint-path
  current: '1.0.0'
  detail: >-
    Neither API carries a global version prefix in its base path. Both OpenAPI
    documents declare info.version 1.0.0. The Audiences API versions an
    individual endpoint when its contract changes —
    POST /search/audiences (offset paged) and POST /search/audiences/v2
    (cursor paged) are both published and both current. The Privacy Management
    API versions by segregating superseded endpoints under a Legacy tag.
  docs: https://audiences.liveintent.com/api-guide
deprecation:
  policy_url: https://privacy.liadm.com/api-guide
  policy_published: false
  sunset_header: false
  detail: >-
    LiveIntent publishes no dated deprecation policy, no sunset timeline and no
    RFC 8594 Sunset/Deprecation headers. What it does publish is a Legacy
    section in the Privacy Management API guide stating the endpoints under it
    "are deprecated and should not be used for new integrations". That is a
    named, documented deprecation of specific operations — but with no removal
    date and no header signal, an agent cannot detect the deprecation at
    runtime.
  machine_readable: false
  note: >-
    The Legacy operations are described as deprecated in prose but are NOT
    marked `deprecated: true` in the OpenAPI document, so the deprecation is
    invisible to any tool that reads only the spec.
