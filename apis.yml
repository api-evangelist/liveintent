aid: liveintent
name: LiveIntent
description: LiveIntent is a people-based email marketing and identity platform serving more than
  2,500 businesses. It connects marketers and publishers through email-native audience targeting,
  publisher inventory monetization (LiveTag and native ad blueprints), and identity resolution across
  the digital ecosystem, including its HIRO first-party data solution and email reactivation services.
  Its primary public developer surface is the open-source LiveConnect first-party identity library
  (npm live-connect-js) rather than a REST API, plus partner data integrations with Segment, Oracle,
  Adobe, Merkle and LiveRamp. LiveIntent has agreed to be acquired by Zeta Global. Backed by Battery
  Ventures and Bullpen Capital.
