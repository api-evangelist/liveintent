aid: liveintent
name: LiveIntent
description: LiveIntent is a people-based email marketing, advertising and identity platform serving
  more than 2,500 businesses. It connects marketers and publishers through email-native audience
  targeting, publisher inventory monetization (LiveTag and native ad blueprints), and identity
  resolution across the digital ecosystem, including its HIRO first-party data solution and email
  reactivation services. LiveIntent publishes four partner APIs — an Audiences API and a Privacy
  Management API, both backed by OpenAPI 3.0.0 definitions rendered through Redocly; a Reporting API
  for publisher and advertiser metrics; and a Programmatic Bidding API implementing a subset of IAB
  OpenRTB 2.5 with OpenRTB Native 1.1 and 1.2 — alongside the open-source LiveConnect first-party
  identity library (npm live-connect-js) and partner data integrations with Segment, Oracle, Adobe,
  Merkle and LiveRamp. All API access is bearer-token based and provisioned by a LiveIntent account
  team rather than self-service. LiveIntent has been acquired by Zeta Global. Backed by Battery
  Ventures and Bullpen Capital.
