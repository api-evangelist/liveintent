note: >-
  LiveIntent publishes no rate limits for any of its four APIs. The two
  spec-bearing APIs declare no 429 response anywhere across their 20 operations
  (documented statuses are 200, 201, 202, 303, 400, 401, 403, 404 and 500), no
  X-RateLimit-* or RateLimit-* header is documented, and no Retry-After
  behaviour is described. The Reporting API guide documents only the 12-hour
  access-token expiry and a 401 on a missing or expired token — it says nothing
  about request volume. This is an honest zero: an agent calling LiveIntent has
  no documented throttling contract and no runtime signal to back off on.
