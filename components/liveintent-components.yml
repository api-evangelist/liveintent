note: >-
  LiveIntent's client-side surface is tag- and script-based rather than a UI
  component library: there are no web components, no embeddable dashboards and
  no hosted prebuilt screens. What it ships are browser scripts that collect
  identity and render ad inventory. They are catalogued here because for
  LiveIntent this IS the integration surface most partners actually deploy —
  materially more partners embed LiveTag or LiveConnect than call the three
  HTTP APIs.
families:
