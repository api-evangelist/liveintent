- name: DataSubjectRequest
  domain: privacy
  schemas: [DataSubjectRequest, NewDataSubjectRequest, DataSubjectRequestWithReport, DataSubjectResponse, DataSubjectRequestSearch, DataSubjectRequestSearchResult]
  id_field: transactionId
  id_type: string
  fields: [transactionId, action, scope, jurisdiction, emailHashes, liveIntentFpcs, submitter, callback, status, userId, createdAt, downloadUrl]
  action_enum: [RESTRICT, ERASURE, ACCESS]
  jurisdiction_enum: [EU_PRIVACY, US_PRIVACY]
  operations: [POST /data-subject-requests, 'POST /data-subject-requests/test', 'GET /data-subject-requests/{transactionId}', POST /search/data-subject-requests]
- name: DsrScope
  domain: privacy
  schemas: [DsrScope, SimpleDsrScope, Advertiser, Publisher, MediaGroup, PublisherMediaGroup, Global]
  kind: discriminated-union
  variants:
  - {variant: Advertiser, fields: [id]}
  - {variant: Publisher, fields: [id]}
  - {variant: MediaGroup, fields: [id]}
  - {variant: PublisherMediaGroup, fields: [pid, mid]}
  - {variant: Global, fields: []}
  note: >-
    A oneOf over the caller's account category on the LiveIntent ad exchange.
    Scope is the authorization model for this API — the blast radius of a
    RESTRICT or ERASURE is decided by which variant the token is entitled to
    use. Global is reserved for authorized third-party agents submitting
    industry-wide requests.
- name: DataSubjectReport
  domain: privacy
  schemas: [DataSubjectRequestWithReport]
  fields: [downloadUrl]
  operations: ['GET /data-subject-report/{transactionId}']
  note: >-
    ACCESS requests produce a report fetched through a 303 redirect to a signed,
    expiring download URL. A 403 on that redirect means the signature expired.
