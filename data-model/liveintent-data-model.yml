source: >-
  openapi/liveintent-audiences-openapi.yml (48 schemas) and
  openapi/liveintent-privacy-openapi.yml (17 schemas), enriched from
  https://audiences.liveintent.com/api-guide and
  https://privacy.liadm.com/api-guide.
note: >-
  Two disjoint domains. The Audiences API models advertising audiences owned by
  an account and fed by bulk uploads and trackers; the Privacy Management API
  models data subject requests scoped to an ad-exchange account category. No
  schema, identifier or $ref is shared between the two specs — they are separate
  data cores that happen to share an error envelope.
id_conventions:
  style: opaque-integer
  detail: >-
    Every identifier in both APIs is a bare integer (accountId, dataProviderId,
    audience id, ruleId, publisher/advertiser/mediaGroup id) with no type
    prefix. The one exception is the Privacy API's transactionId, which is a
    string. There is no prefixed-id convention to key on, so an agent cannot
    tell an audienceId from an accountId by looking at the value.
domains:
- name: audiences
  spec: openapi/liveintent-audiences-openapi.yml
  base_url: https://audiences.liveintent.com
  root_entity: Audience
- name: privacy
  spec: openapi/liveintent-privacy-openapi.yml
  base_url: https://privacy.liadm.com
  root_entity: DataSubjectRequest
