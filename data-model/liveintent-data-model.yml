  status_enum: [Pending, Running, Finished, Error]
  operations: ['POST /audiences/{audienceId}/signed-urls', 'GET /audiences/{audienceId}/uploads']
- name: AudienceCount
  domain: audiences
  schemas: [AudienceCount, AudienceCounts]
  fields: [date, totalCount, matchCount]
  operations: ['GET /audiences/{audienceId}/counts']
  note: A daily time series of total vs matched members for one audience.
- name: DynamicAudienceAttributes
  domain: audiences
  schemas: [DynamicAudienceAttributesDTO]
  fields: [ruleId, ttl]
  note: Attached to tracker-backed (dynamic) audiences rather than uploaded ones.
- name: Tracker
  domain: audiences
  schemas: [UpdateConversionTrackersAndRulePayload]
  id_field: ruleId
  operations: [POST /eventtrackers, POST /urltrackers, PATCH /trackers]
  variants: [event tracker, URL tracker, conversion tracker]
  note: >-
    Trackers create audiences dynamically from observed events or URL visits.
    The three tracker endpoints all mint or update audiences, so Tracker is a
    creation mechanism for Audience rather than a separately readable resource
